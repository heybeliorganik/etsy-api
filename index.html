<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Heybeli Etsy Manager V3.4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f3;
      color: #222;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 22px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      max-width: 1250px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    .refresh-btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    main {
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 20px 60px;
    }

    .summary {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .summary-box {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
    }

    .summary-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    .warning {
      background: #fff8df;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
    }

    .product {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .product h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .listing-id {
      font-size: 12px;
      color: #777;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 15px 0;
    }

    .badge {
      padding: 7px 11px;
      border-radius: 999px;
      background: #eee;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-high {
      background: #e7f5ea;
    }

    .badge-medium {
      background: #fff4d6;
    }

    .badge-low {
      background: #f7e5e5;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin: 15px 0 20px;
    }

    .metric {
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      padding: 12px;
    }

    .metric-label {
      font-size: 12px;
      color: #777;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .content-box {
      background: #f8f8f8;
      border-radius: 9px;
      padding: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .suggested {
      border-left: 4px solid #222;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: #eee;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button.action-btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .title-btn {
      background: #111;
      color: #fff;
    }

    .tag-btn {
      background: #f1641e;
      color: #fff;
    }

    .description-btn {
      background: #2f6fed;
      color: #fff;
    }

    .attribute-btn {
      background: #5f3dc4;
      color: #fff;
    }

    .safe-attribute-btn {
      background: #1f8f4e;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .etsy-link {
      display: inline-block;
      text-decoration: none;
      border: 1px solid #222;
      color: #222;
      border-radius: 8px;
      padding: 10px 16px;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .success {
      color: #087f23;
    }

    .error {
      color: #b00020;
    }

    .attribute-panel {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
      display: none;
    }

    .attribute-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .attribute-count {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 9px;
      padding: 12px;
    }

    .attribute-group {
      margin-top: 15px;
    }

    .attribute-group h4 {
      margin: 0 0 8px;
    }

    .attribute-item {
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 9px;
      padding: 11px;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .safe-item {
      border-left: 5px solid #219653;
    }

    .check-item {
      border-left: 5px solid #f2c94c;
    }

    .leave-item {
      border-left: 5px solid #999;
    }

    .current-item {
      border-left: 5px solid #2f6fed;
    }
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <h1>Heybeli Etsy Manager V3.4</h1>

      <div class="subtitle">
        Etsy canlı performansı + SEO + Trendyol dış pazar sinyali + güvenli attributes
      </div>
    </div>

    <button
      class="refresh-btn"
      onclick="loadStrategy()"
    >
      Verileri Yenile
    </button>
  </div>
</header>

<main>

  <div
    class="summary"
    id="summary"
  >
    Veriler yükleniyor...
  </div>

  <div id="products"></div>

</main>

<script>

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function priorityClass(value) {
  const v =
    String(value || "")
      .toUpperCase();

  if (v === "HIGH") {
    return "badge-high";
  }

  if (v === "MEDIUM") {
    return "badge-medium";
  }

  if (v === "LOW") {
    return "badge-low";
  }

  return "";
}

async function loadStrategy() {
  const summary =
    document.getElementById("summary");

  const products =
    document.getElementById("products");

  summary.innerHTML =
    "Veriler yükleniyor...";

  products.innerHTML = "";

  try {
    const response =
      await fetch(
        "/api/seoStrategy",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error ||
        "Strateji verileri alınamadı."
      );
    }

    summary.innerHTML = `
      <strong>
        Sistem aktif ✅
      </strong>

      <div class="summary-grid">

        <div class="summary-box">
          <div class="small">
            Strateji sürümü
          </div>

          <div>
            ${escapeHtml(
              data.strategy_version
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Analiz edilen ürün
          </div>

          <div class="summary-number">
            ${Number(
              data.analyzed_count || 0
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Onay bekleyen
          </div>

          <div class="summary-number">
            ${Number(
              data.pending_count || 0
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Sistem modu
          </div>

          <div>
            ${escapeHtml(
              data.system_mode
            )}
          </div>
        </div>

      </div>

      <div class="warning">
        Başlık, etiket ve SEO açıklama girişi ayrı ayrı onaylanır.
        Attribute tarafında yalnızca güvenli olarak doğrulanan değerler
        kullanıcı onayından sonra Etsy'ye uygulanır.
      </div>
    `;

    for (
      const item
      of data.pending_changes || []
    ) {
      renderProduct(item);
    }

  } catch (error) {
    summary.innerHTML = `
      <span class="error">
        Hata:
        ${escapeHtml(
          error.message
        )}
      </span>
    `;
  }
}

function renderProduct(item) {
  const products =
    document.getElementById(
      "products"
    );

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "product";

  const tags =
    Array.isArray(
      item.suggested_tags
    )
      ? item.suggested_tags
      : [];

  card.innerHTML = `

    <div class="product-top">

      <div>
        <h2>
          ${escapeHtml(item.color)}
          -
          ${escapeHtml(
            item.product_type
          )}
        </h2>

        <div class="listing-id">
          Listing ID:
          ${escapeHtml(
            item.listing_id
          )}
        </div>
      </div>

      <div>
        ${
          item.external_market_signal ===
          "HIGH"
            ? '<span class="badge badge-high">Trendyol sinyali: HIGH</span>'
            : '<span class="badge">Trendyol sinyali: UNKNOWN</span>'
        }
      </div>

    </div>

    <div class="badges">

      <span class="badge ${priorityClass(
        item.seo_priority
      )}">
        SEO:
        ${escapeHtml(
          item.seo_priority
        )}
      </span>

      <span class="badge ${priorityClass(
        item.ad_priority
      )}">
        Reklam:
        ${escapeHtml(
          item.ad_priority
        )}
      </span>

      <span class="badge">
        Aksiyon:
        ${escapeHtml(
          item.action
        )}
      </span>

      <span class="badge">
        Durum:
        ${escapeHtml(
          item.approval_status
        )}
      </span>

    </div>

    <div class="metrics">

      <div class="metric">
        <div class="metric-label">
          Etsy performans
        </div>

        <div class="metric-value">
          ${Number(
            item.etsy_performance_score ||
            0
          ).toFixed(1)}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Genel skor
        </div>

        <div class="metric-value">
          ${Number(
            item.overall_score || 0
          ).toFixed(1)}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Görüntülenme
        </div>

        <div class="metric-value">
          ${Number(
            item.views || 0
          )}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Favori
        </div>

        <div class="metric-value">
          ${Number(
            item.favorites || 0
          )}
        </div>
      </div>

    </div>

    <div class="section">
      <div class="section-title">
        Mevcut başlık
      </div>

      <div class="content-box">
        ${escapeHtml(
          item.current_title
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Önerilen Etsy başlığı
      </div>

      <div class="content-box suggested">
        ${escapeHtml(
          item.suggested_title
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Neden?
      </div>

      <div class="content-box">
        ${escapeHtml(
          item.reason
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Önerilen 13 Etsy etiketi
      </div>

      <div class="tags">
        ${tags.map(
          tag => `
            <span class="tag">
              ${escapeHtml(tag)}
            </span>
          `
        ).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Önerilen açıklama girişi
      </div>

      <div class="content-box suggested">
        ${escapeHtml(
          item.suggested_description_opening
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Görsel aksiyonu
      </div>

      <div class="content-box">
        ${escapeHtml(
          item.image_action
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Etsy Attributes aksiyonu
      </div>

      <div class="content-box">
        ${escapeHtml(
          item.attributes_action
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Dış pazar sinyali
      </div>

      <div class="content-box">
        Kaynak:
        ${escapeHtml(
          item.external_market_source
        )}

        <br>

        Sinyal:
        ${escapeHtml(
          item.external_market_signal
        )}
      </div>
    </div>

    <div class="actions">

      <button
        class="action-btn title-btn"
        id="title-${item.listing_id}"
      >
        Başlığı Onayla ve Etsy'ye Uygula
      </button>

      <button
        class="action-btn tag-btn"
        id="tags-${item.listing_id}"
      >
        13 Etiketi Onayla ve Etsy'ye Uygula
      </button>

      <button
        class="action-btn description-btn"
        id="description-${item.listing_id}"
      >
        SEO Açıklama Girişini Onayla ve Etsy'ye Uygula
      </button>

      <button
        class="action-btn attribute-btn"
        id="attributes-${item.listing_id}"
      >
        Attributes Analizini Aç
      </button>

      <a
        class="etsy-link"
        href="${escapeHtml(
          item.url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Etsy Ürününü Aç
      </a>

    </div>

    <div
      class="result"
      id="result-${item.listing_id}"
    ></div>

    <div
      class="attribute-panel"
      id="attribute-panel-${item.listing_id}"
    >
      Attribute analizi yükleniyor...
    </div>
  `;

  products.appendChild(
    card
  );

  document
    .getElementById(
      "title-" +
      item.listing_id
    )
    .addEventListener(
      "click",
      function () {
        approveTitle(
          item.listing_id,
          item.suggested_title
        );
      }
    );

  document
    .getElementById(
      "tags-" +
      item.listing_id
    )
    .addEventListener(
      "click",
      function () {
        approveTags(
          item.listing_id,
          tags
        );
      }
    );

  document
    .getElementById(
      "description-" +
      item.listing_id
    )
    .addEventListener(
      "click",
      function () {
        approveDescription(
          item.listing_id,
          item.suggested_description_opening
        );
      }
    );

  document
    .getElementById(
      "attributes-" +
      item.listing_id
    )
    .addEventListener(
      "click",
      function () {
        loadAttributes(
          item
        );
      }
    );
}

async function approveTitle(
  listingId,
  suggestedTitle
) {
  const result =
    document.getElementById(
      "result-" +
      listingId
    );

  const confirmed =
    window.confirm(
      "Bu işlem Etsy'deki gerçek ürün başlığını değiştirecek.\n\n" +
      suggestedTitle +
      "\n\nOnaylıyor musunuz?"
    );

  if (!confirmed) {
    return;
  }

  try {
    const response =
      await fetch(
        "/api/updateListing",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json; charset=utf-8"
          },

          body: JSON.stringify({
            listing_id:
              Number(
                listingId
              ),

            title:
              suggestedTitle,

            confirm:
              "YES"
          })
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error
      );
    }

    result.className =
      "result success";

    result.textContent =
      "Başlık başarıyla Etsy'ye uygulandı.";

  } catch (error) {
    result.className =
      "result error";

    result.textContent =
      "Başlık hatası: " +
      error.message;
  }
}

    result.className =

      error.message;
  }
}

async function loadAttributes(
  item
) {
  const panel =
    document.getElementById(
      "attribute-panel-" +
      item.listing_id
    );

  panel.style.display =
    "block";

  panel.innerHTML =
    "Attribute analizi yükleniyor...";

  try {
    const response =
      await fetch(
        "/api/listingAttributes?listing_id=" +
        encodeURIComponent(
          item.listing_id
        ),
        {
          cache:
            "no-store"
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error
      );
    }

    renderAttributeAnalysis(
      panel,
      item,
      data
    );

  } catch (error) {
    panel.innerHTML = `
      <div class="error">
        Attribute hatası:
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}

function findPossibleValue(
  property,
  wantedValue
) {
  const values =
    Array.isArray(
      property.possible_values
    )
      ? property.possible_values
      : [];

  const wanted =
    String(
      wantedValue || ""
    )
      .toLowerCase()
      .trim();

  return values.find(
    value =>
      String(
        value.name || ""
      )
        .toLowerCase()
        .trim() ===
      wanted
  );
}

function analyzeMissingProperty(
  property,
  item
) {
  const name =
    String(
      property.name ||
      property.display_name ||
      ""
    )
      .toLowerCase()
      .trim();

  const colors =
    Array.isArray(
      item.colors
    )
      ? item.colors
      : [];

  const primaryColor =
    item.color &&
    item.color !== "Unknown"
      ? item.color
      : colors[0];

  if (
    name ===
      "primary color" &&
    primaryColor
  ) {
    const match =
      findPossibleValue(
        property,
        primaryColor
      );

    if (match) {
      return {
        group:
          "safe",

        recommendation:
          `Güvenli öneri: ${match.name}`,

        reason:
          "Ürünün mevcut başlık/renginden doğrudan tespit edildi.",

        property_id:
          Number(
            property.property_id
          ),

        value_id:
          Number(
            match.value_id
          ),

        value_name:
          String(
            match.name
          ),

        scale_id:
          match.scale_id ??
          null
      };
    }
  }

  if (
    name ===
    "secondary color"
  ) {
    return {
      group:
        "leave",

      recommendation:
        "Şimdilik boş bırak.",

      reason:
        "İkinci renk kesin olarak doğrulanmadı."
    };
  }

  if (
    name === "occasion" ||
    name === "holiday"
  ) {
    return {
      group:
        "leave",

      recommendation:
        "Boş bırak.",

      reason:
        "Ürün özel gün ürünü olarak doğrulanmadı."
    };
  }

  return {
    group:
      "check",

    recommendation:
      "Kontrol gerekli.",

    reason:
      "Bu attribute için otomatik güvenli karar verilmedi."
  };
}

function renderAttributeAnalysis(
  panel,
  item,
  data
) {
  const current =
    Array.isArray(
      data.current_properties
    )
      ? data.current_properties
      : [];

  const missing =
    Array.isArray(
      data.missing_properties
    )
      ? data.missing_properties
      : [];

  const safe = [];
  const check = [];
  const leave = [];

  for (
    const property
    of missing
  ) {
    const analysis =
      analyzeMissingProperty(
        property,
        item
      );

    const row = {
      ...property,
      ...analysis
    };

    if (
      analysis.group ===
      "safe"
    ) {
      safe.push(row);
    } else if (
      analysis.group ===
      "leave"
    ) {
      leave.push(row);
    } else {
      check.push(row);
    }
  }

  panel.innerHTML = `

    <h3>
      Etsy Attributes Analizi
    </h3>

    <div class="attribute-summary">

      <div class="attribute-count">
        <strong>
          ${Number(
            data.current_count || 0
          )}
        </strong>
        <br>
        Mevcut attribute
      </div>

      <div class="attribute-count">
        <strong>
          ${Number(
            data.missing_count || 0
          )}
        </strong>
        <br>
        Eksik attribute
      </div>

      <div class="attribute-count">
        <strong>
          ${safe.length}
        </strong>
        <br>
        Güvenli öneri
      </div>

      <div class="attribute-count">
        <strong>
          ${check.length}
        </strong>
        <br>
        Kontrol gerekli
      </div>

    </div>

    <div class="attribute-group">

      <h4>
        ✅ Güvenle doldurulabilir
      </h4>

      ${
        safe.length
          ? safe.map(
              property => `
                <div class="attribute-item safe-item">
                  <strong>
                    ${escapeHtml(
                      property.display_name ||
                      property.name
                    )}
                  </strong>

                  <br>

                  ${escapeHtml(
                    property.recommendation
                  )}

                  <br>

                  <span class="small">
                    ${escapeHtml(
                      property.reason
                    )}
                  </span>
                </div>
              `
            ).join("")
          : `
            <div class="attribute-item">
              Güvenli öneri bulunamadı.
            </div>
          `
      }

      ${
        safe.length
          ? `
            <button
              class="action-btn safe-attribute-btn"
              id="safe-attributes-${item.listing_id}"
            >
              Güvenli Attributes Uygula
            </button>

            <div
              class="result"
              id="safe-result-${item.listing_id}"
            ></div>
          `
          : ""
      }

    </div>

    <div class="attribute-group">

      <h4>
        ⚠️ Ürün bilgisi kontrol edilmeli
      </h4>

      ${
        check.length
          ? check.map(
              property => `
                <div class="attribute-item check-item">
                  <strong>
                    ${escapeHtml(
                      property.display_name ||
                      property.name
                    )}
                  </strong>

                  <br>

                  ${escapeHtml(
                    property.recommendation
                  )}

                  <br>

                  <span class="small">
                    ${escapeHtml(
                      property.reason
                    )}
                  </span>
                </div>
              `
            ).join("")
          : `
            <div class="attribute-item">
              Kontrol bekleyen alan yok.
            </div>
          `
      }

    </div>

    <div class="attribute-group">

      <h4>
        ⏸️ Boş bırakılması daha güvenli
      </h4>

      ${
        leave.length
          ? leave.map(
              property => `
                <div class="attribute-item leave-item">
                  <strong>
                    ${escapeHtml(
                      property.display_name ||
                      property.name
                    )}
                  </strong>

                  <br>

                  ${escapeHtml(
                    property.recommendation
                  )}
                </div>
              `
            ).join("")
          : `
            <div class="attribute-item">
              Bu grupta alan yok.
            </div>
          `
      }

    </div>

    <div class="attribute-group">

      <h4>
        📌 Etsy'de zaten bulunan attribute'lar
      </h4>

      ${
        current.length
          ? current.map(
              property => `
                <div class="attribute-item current-item">
                  <strong>
                    ${escapeHtml(
                      property.property_name ||
                      property.name ||
                      "Attribute"
                    )}
                  </strong>

                  <br>

                  ${escapeHtml(
                    Array.isArray(
                      property.values
                    )
                      ? property.values.join(", ")
                      : ""
                  )}
                </div>
              `
            ).join("")
          : `
            <div class="attribute-item">
              Mevcut attribute bulunamadı.
            </div>
          `
      }

    </div>
  `;

  if (
    safe.length
  ) {
    document
      .getElementById(
        "safe-attributes-" +
        item.listing_id
      )
      .addEventListener(
        "click",
        function () {
          applySafeAttributes(
            item.listing_id,
            safe
          );
        }
      );
  }
}

async function applySafeAttributes(
  listingId,
  safeAttributes
) {
  const result =
    document.getElementById(
      "safe-result-" +
      listingId
    );

  const button =
    document.getElementById(
      "safe-attributes-" +
      listingId
    );

  const preview =
    safeAttributes
      .map(
        attribute =>
          `${attribute.display_name || attribute.name}: ${attribute.value_name}`
      )
      .join("\n");

  const confirmed =
    window.confirm(
      "Yalnızca aşağıdaki güvenli attribute değerleri Etsy'ye uygulanacak.\n\n" +
      preview +
      "\n\nDiğer attribute'lara dokunulmayacak.\n\nOnaylıyor musunuz?"
    );

  if (!confirmed) {
    return;
  }

  button.disabled =
    true;

  result.className =
    "result";

  result.textContent =
    "Güvenli attribute Etsy'ye gönderiliyor...";

  try {
    for (
      const attribute
      of safeAttributes
    ) {
      const response =
        await fetch(
          "/api/updateAttribute",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json; charset=utf-8"
            },

            body:
              JSON.stringify({
                listing_id:
                  Number(
                    listingId
                  ),

                property_id:
                  Number(
                    attribute.property_id
                  ),

                value_id:
                  Number(
                    attribute.value_id
                  ),

                value_name:
                  String(
                    attribute.value_name
                  ),

                scale_id:
                  attribute.scale_id ??
                  null,

                confirm:
                  "YES"
              })
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {
        throw new Error(
          `${attribute.display_name || attribute.name}: ` +
          (
            data.error ||
            "Attribute güncellenemedi."
          ) +
          (
            data.details
              ? " " +
                JSON.stringify(
                  data.details
                )
              : ""
          )
        );
      }
    }

    result.className =
      "result success";

    result.textContent =
      "Güvenli attribute başarıyla Etsy'ye uygulandı.";

  } catch (error) {
    result.className =
      "result error";

    result.textContent =
      "Attribute hatası: " +
      error.message;
  }

  button.disabled =
    false;
}

loadStrategy();

</script>
