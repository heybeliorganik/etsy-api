<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heybeli Etsy Manager V4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f3;
      color: #222;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 22px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-row {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    .refresh-btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 20px 60px;
    }

    .summary {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .summary-box {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
    }

    .summary-number {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small {
      font-size: 12px;
      color: #777;
    }

    .notice {
      margin-top: 15px;
      background: #fff8df;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.5;
      font-size: 13px;
    }

    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .product h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .listing-id {
      color: #777;
      font-size: 12px;
    }

    .decision-hero {
      margin-top: 18px;
      border-radius: 12px;
      padding: 18px;
      background: #f4f4f4;
      border-left: 6px solid #222;
    }

    .decision-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
    }

    .decision-value {
      font-size: 23px;
      font-weight: bold;
    }

    .decision-reason {
      margin-top: 10px;
      line-height: 1.55;
      font-size: 14px;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .decision-box {
      border: 1px solid #e1e1e1;
      border-radius: 10px;
      padding: 13px;
      background: #fafafa;
    }

    .decision-box-label {
      font-size: 12px;
      color: #777;
    }

    .decision-box-value {
      margin-top: 5px;
      font-size: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .metric {
      border: 1px solid #e4e4e4;
      border-radius: 10px;
      padding: 13px;
    }

    .metric-label {
      font-size: 12px;
      color: #777;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: bold;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .content-box {
      background: #f8f8f8;
      border-radius: 9px;
      padding: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .suggested {
      border-left: 4px solid #111;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 9px;
      background: #eee;
      border-radius: 999px;
      font-size: 12px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .badge {
      border-radius: 999px;
      padding: 7px 10px;
      background: #eee;
      font-size: 12px;
      font-weight: bold;
    }

    .high {
      background: #e3f5e8;
    }

    .medium {
      background: #fff2cb;
    }

    .low {
      background: #f3e4e4;
    }

    .keep {
      background: #e7f5ea;
    }

    .change {
      background: #fff1cf;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button.action-btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .title-btn {
      background: #111;
      color: white;
    }

    .tag-btn {
      background: #f1641e;
      color: white;
    }

    .description-btn {
      background: #2f6fed;
      color: white;
    }

    .etsy-link {
      display: inline-block;
      padding: 10px 16px;
      text-decoration: none;
      border: 1px solid #222;
      border-radius: 8px;
      color: #222;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .success {
      color: #087f23;
    }

    .error {
      color: #b00020;
    }

    .protect {
      border-left-color: #198754;
    }

    .test-ads {
      border-left-color: #6f42c1;
    }

    .improve-seo {
      border-left-color: #f1641e;
    }

    .review-image {
      border-left-color: #dc9c00;
    }

    .wait-data {
      border-left-color: #2f6fed;
    }

    .fix-before-ads {
      border-left-color: #b00020;
    }

    @media (max-width: 650px) {
      header {
        padding: 16px;
      }

      main {
        padding: 0 12px 40px;
      }

      h1 {
        font-size: 22px;
      }

      .product {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <h1>Heybeli Etsy Manager V4</h1>

      <div class="subtitle">
        Etsy karar motoru • SEO • Reklam • Başlık • 13 Tag • Açıklama
      </div>
    </div>

    <button
      class="refresh-btn"
      onclick="loadStrategy()"
    >
      Verileri Yenile
    </button>
  </div>
</header>

<main>

  <div
    class="summary"
    id="summary"
  >
    Veriler yükleniyor...
  </div>

  <div id="products"></div>

</main>

<script>

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function priorityClass(value) {
  const v =
    String(value || "")
      .toUpperCase();

  if (v === "HIGH") return "high";
  if (v === "MEDIUM") return "medium";
  if (v === "LOW") return "low";

  return "";
}

function decisionClass(action) {
  const value =
    String(action || "")
      .toUpperCase();

  if (value === "PROTECT") {
    return "protect";
  }

  if (value === "TEST_ADS") {
    return "test-ads";
  }

  if (value === "IMPROVE_SEO") {
    return "improve-seo";
  }

  if (value === "REVIEW_IMAGE") {
    return "review-image";
  }

  if (value === "WAIT_FOR_DATA") {
    return "wait-data";
  }

  if (value === "FIX_BEFORE_ADS") {
    return "fix-before-ads";
  }

  return "";
}

function decisionText(value) {
  const v =
    String(value || "")
      .toUpperCase();

  const map = {
    PROTECT:
      "İyi çalışan ürünü koru",

    TEST_ADS:
      "Kontrollü reklam testi",

    IMPROVE_SEO:
      "SEO'yu kontrollü geliştir",

    REVIEW_IMAGE:
      "Ana görseli ve tıklamayı incele",

    WAIT_FOR_DATA:
      "Veri topla ve bekle",

    FIX_BEFORE_ADS:
      "Reklamdan önce listing'i düzelt",

    CONTROLLED_AD_TEST:
      "Kontrollü reklam testi",

    TEST_SMALL_BUDGET:
      "Küçük bütçeyle test et",

    DO_NOT_ADVERTISE_YET:
      "Şimdilik reklam verme",

    WAIT:
      "Bekle",

    KEEP:
      "Koru",

    ONLY_MINOR_CHANGES:
      "Sadece küçük değişiklik",

    IMPROVE_LIGHTLY:
      "Hafif iyileştir",

    IMPROVE:
      "İyileştir",

    PREPARE_CHANGES:
      "Değişiklikleri hazırla",

    REVIEW_AND_UPDATE:
      "Kontrol et ve güncelle"
  };

  return map[v] || value || "-";
}

function yesNoChange(
  changeNeeded
) {
  return changeNeeded
    ? "Güncelleme öneriliyor"
    : "Koru";
}

async function loadStrategy() {
  const summary =
    document.getElementById(
      "summary"
    );

  const products =
    document.getElementById(
      "products"
    );

  summary.innerHTML =
    "V4 karar motoru verileri yükleniyor...";

  products.innerHTML = "";

  try {
    const response =
      await fetch(
        "/api/seoStrategy",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error ||
        "V4 strateji verileri alınamadı."
      );
    }

    summary.innerHTML = `

      <strong>
        Heybeli Etsy V4 aktif ✅
      </strong>

      <div class="summary-grid">

        <div class="summary-box">
          <div class="small">
            Motor sürümü
          </div>

          <div>
            ${escapeHtml(
              data.strategy_version
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Analiz edilen ürün
          </div>

          <div class="summary-number">
            ${Number(
              data.analyzed_count || 0
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Onay bekleyen
          </div>

          <div class="summary-number">
            ${Number(
              data.pending_count || 0
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="small">
            Sistem modu
          </div>

          <div>
            ${escapeHtml(
              data.system_mode
            )}
          </div>
        </div>

      </div>

      <div class="notice">
        V4 karar motoru Etsy'nin gizli algoritmasını bildiğini iddia etmez.
        Puanlar; mağazanın canlı verileri, görüntülenme, favori,
        listing yaşı ve bizim kontrollü test kurallarımız kullanılarak
        oluşturulan karar destek sistemidir.
        Hiçbir başlık, tag veya açıklama otomatik değiştirilmez.
        Son onay her zaman sende kalır.
      </div>
    `;

    const items =
      Array.isArray(
        data.pending_changes
      )
        ? data.pending_changes
        : [];

    for (const item of items) {
      renderProduct(item);
    }

  } catch (error) {
    summary.innerHTML = `
      <span class="error">
        Hata:
        ${escapeHtml(
          error.message
        )}
      </span>
    `;
  }
}

function renderProduct(item) {
  const products =
    document.getElementById(
      "products"
    );

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "product";

  const tags =
    Array.isArray(
      item.suggested_tags
    )
      ? item.suggested_tags
      : [];

  const titleNeedsChange =
    Boolean(
      item.title_change_needed
    );

  const tagsNeedChange =
    Boolean(
      item.tags_change_needed
    );

  const descriptionNeedsChange =
    Boolean(
      item.description_change_needed
    );

  card.innerHTML = `

    <div class="product-top">

      <div>
        <h2>
          ${escapeHtml(
            item.color
          )}
          -
          ${escapeHtml(
            item.product_type
          )}
        </h2>

        <div class="listing-id">
          Listing ID:
          ${escapeHtml(
            item.listing_id
          )}
        </div>
      </div>

      <div class="badges">

        <span class="badge ${priorityClass(
          item.seo_priority
        )}">
          SEO:
          ${escapeHtml(
            item.seo_priority
          )}
        </span>

        <span class="badge ${priorityClass(
          item.ad_priority
        )}">
          Reklam:
          ${escapeHtml(
            item.ad_priority
          )}
        </span>

      </div>

    </div>

    <div class="decision-hero ${decisionClass(
      item.today_action
    )}">

      <div class="decision-title">
        BUGÜNKÜ ANA KARAR
      </div>

      <div class="decision-value">
        ${escapeHtml(
          item.today_action_label ||
          decisionText(
            item.today_action
          )
        )}
      </div>

      <div class="decision-reason">
        ${escapeHtml(
          item.reason
        )}
      </div>

    </div>

    <div class="decision-grid">

      <div class="decision-box">
        <div class="decision-box-label">
          Reklam kararı
        </div>

        <div class="decision-box-value">
          ${escapeHtml(
            decisionText(
              item.ad_decision
            )
          )}
        </div>
      </div>

      <div class="decision-box">
        <div class="decision-box-label">
          SEO kararı
        </div>

        <div class="decision-box-value">
          ${escapeHtml(
            decisionText(
              item.seo_decision
            )
          )}
        </div>
      </div>

      <div class="decision-box">
        <div class="decision-box-label">
          Başlık
        </div>

        <div class="decision-box-value">
          ${escapeHtml(
            yesNoChange(
              titleNeedsChange
            )
          )}
        </div>
      </div>

      <div class="decision-box">
        <div class="decision-box-label">
          Tag
        </div>

        <div class="decision-box-value">
          ${escapeHtml(
            yesNoChange(
              tagsNeedChange
            )
          )}
        </div>
      </div>

      <div class="decision-box">
        <div class="decision-box-label">
          Açıklama
        </div>

        <div class="decision-box-value">
          ${escapeHtml(
            yesNoChange(
              descriptionNeedsChange
            )
          )}
        </div>
      </div>

      <div class="decision-box">
        <div class="decision-box-label">
          Sonraki değerlendirme
        </div>

        <div class="decision-box-value">
          ${Number(
            item.wait_days || 0
          )} gün
        </div>
      </div>

    </div>

    <div class="metrics">

      <div class="metric">
        <div class="metric-label">
          Görüntülenme
        </div>

        <div class="metric-value">
          ${Number(
            item.views || 0
          )}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Favori
        </div>

        <div class="metric-value">
          ${Number(
            item.favorites || 0
          )}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Etsy performans
        </div>

        <div class="metric-value">
          ${Number(
            item.etsy_performance_score || 0
          ).toFixed(1)}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Genel skor
        </div>

        <div class="metric-value">
          ${Number(
            item.overall_score || 0
          ).toFixed(1)}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Yayında
        </div>

        <div class="metric-value">
          ${
            item.days_live === null ||
            item.days_live === undefined
              ? "-"
              : Number(
                  item.days_live
                ) + " gün"
          }
        </div>
      </div>

    </div>

    <div class="section">
      <div class="section-title">
        Mevcut başlık
      </div>

      <div class="content-box">
        ${escapeHtml(
          item.current_title
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        V4 önerilen başlık
      </div>

      <div class="content-box suggested">
        ${escapeHtml(
          item.suggested_title
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        V4 önerilen 13 Etsy tag
      </div>

      <div class="tags">
        ${tags.map(
          tag => `
            <span class="tag">
              ${escapeHtml(tag)}
            </span>
          `
        ).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        V4 önerilen açıklama girişi
      </div>

      <div class="content-box suggested">
        ${escapeHtml(
          item.suggested_description_opening
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Ana görsel kararı
      </div>

      <div class="content-box">
        ${escapeHtml(
          decisionText(
            item.image_action
          )
        )}
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Dış pazar sinyali
      </div>

      <div class="content-box">
        Kaynak:
        ${escapeHtml(
          item.external_market_source
        )}

        <br>

        Sinyal:
        ${escapeHtml(
          item.external_market_signal
        )}

        <br><br>

        ${escapeHtml(
          item.external_market_reason
        )}
      </div>
    </div>

    <div class="actions">

      <button
        class="action-btn title-btn"
        id="title-${item.listing_id}"
        ${titleNeedsChange ? "" : "disabled"}
      >
        ${
          titleNeedsChange
            ? "Başlığı Onayla ve Etsy'ye Uygula"
            : "Başlığı Koru"
        }
      </button>

      <button
        class="action-btn tag-btn"
        id="tags-${item.listing_id}"
        ${tagsNeedChange ? "" : "disabled"}
      >
        ${
          tagsNeedChange
            ? "13 Tag'i Onayla ve Etsy'ye Uygula"
            : "Tagleri Koru"
        }
      </button>

      <button
        class="action-btn description-btn"
        id="description-${item.listing_id}"
        ${descriptionNeedsChange ? "" : "disabled"}
      >
        ${
          descriptionNeedsChange
            ? "Açıklama Girişini Onayla ve Uygula"
            : "Açıklamayı Koru"
        }
      </button>

      <a
        class="etsy-link"
        href="${escapeHtml(
          item.url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Etsy Ürününü Aç
      </a>

    </div>

    <div
      class="result"
      id="result-${item.listing_id}"
    ></div>

  `;

  products.appendChild(
    card
  );

  if (titleNeedsChange) {
    document
      .getElementById(
        "title-" +
        item.listing_id
      )
      .addEventListener(
        "click",
        function () {
          approveTitle(
            item.listing_id,
            item.suggested_title
          );
        }
      );
  }

  if (tagsNeedChange) {
    document
      .getElementById(
        "tags-" +
        item.listing_id
      )
      .addEventListener(
        "click",
        function () {
          approveTags(
            item.listing_id,
            tags
          );
        }
      );
  }

  if (descriptionNeedsChange) {
    document
      .getElementById(
        "description-" +
        item.listing_id
      )
      .addEventListener(
        "click",
        function () {
          approveDescription(
            item.listing_id,
            item.suggested_description_opening
          );
        }
      );
  }
}

async function approveTitle(
  listingId,
  suggestedTitle
) {
  const result =
    document.getElementById(
      "result-" +
      listingId
    );

  const confirmed =
    window.confirm(
      "Bu işlem Etsy'deki gerçek ürün başlığını değiştirecek.\n\n" +
      suggestedTitle +
      "\n\nOnaylıyor musunuz?"
    );

  if (!confirmed) {
    return;
  }

  result.className =
    "result";

  result.textContent =
    "Başlık Etsy'ye gönderiliyor...";

  try {
    const response =
      await fetch(
        "/api/updateListing",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json; charset=utf-8"
          },

          body: JSON.stringify({
            listing_id:
              Number(
                listingId
              ),

            title:
              suggestedTitle,

            confirm:
              "YES"
          })
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error ||
        "Başlık güncellenemedi."
      );
    }

    result.className =
      "result success";

    result.textContent =
      "Başlık başarıyla Etsy'ye uygulandı.";

  } catch (error) {
    result.className =
      "result error";

    result.textContent =
      "Başlık hatası: " +
      error.message;
  }
}

async function approveTags(
  listingId,
  tags
) {
  const result =
    document.getElementById(
      "result-" +
      listingId
    );

  const preview =
    tags
      .map(
        (tag, index) =>
          `${index + 1}. ${tag}`
      )
      .join("\n");

  const confirmed =
    window.confirm(
      "Aşağıdaki tagler Etsy'ye uygulanacak:\n\n" +
      preview +
      "\n\nOnaylıyor musunuz?"
    );
